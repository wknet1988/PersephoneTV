name: Release

# 打 tag（如 v1.0.1）自动构建并发布 Release，APK 作为附件挂在 Release 下。
# 用仓库自带的 GITHUB_TOKEN，不需要额外配置 secret。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK 就直接用，没有才下载 cmdline-tools。
      # 不用 android-actions/setup-android，那个 action 在 runner 上会挂。
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "runner 没有可用的 cmdline-tools，改为下载"
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSLo /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          else
            echo "使用 runner 预装 SDK: $SDK_ROOT"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | head -20

      # 仓库里的 wrapper 指向腾讯云镜像（方便国内 clone），CI 在海外跑，换回官方源
      - name: Point wrapper at official Gradle
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/PersephoneTV-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/PersephoneTV-${GITHUB_REF_NAME}-release.apk"
          ls -lh out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.ref_name }}
          path: out/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          draft: false
          prerelease: false
          body: |
            ## Persephone TV ${{ github.ref_name }}

            Android TV 直播 / 影视播放器。Jetpack Compose 手写电视端焦点管理，遥控器操作，无触摸依赖。

            ### 下载

            | 文件 | 说明 |
            | --- | --- |
            | `PersephoneTV-${{ github.ref_name }}-release.apk` | 推荐，直接安装 |
            | `PersephoneTV-${{ github.ref_name }}-debug.apk` | 带调试信息，排查问题用 |

            ### 安装

            ```bash
            adb connect 192.168.x.x:5555     # 电视/盒子需先打开「网络调试」
            adb install -r PersephoneTV-${{ github.ref_name }}-release.apk
            ```

            也可以用 U 盘拷到电视上，用文件管理器点开安装（需允许「未知来源」）。

            ### 说明

            - 支持 Android 5.0 (API 21) 及以上，横屏，适配遥控器
            - 不内置任何内容源，首次使用请到「设置」填自己的 M3U / JSON 地址，或到「找源」检索公开索引
            - release 包暂用 debug 签名，可直接安装

            **完整变更**：https://github.com/wknet1988/PersephoneTV/commits/${{ github.ref_name }}
            **使用文档**：https://github.com/wknet1988/PersephoneTV#readme
