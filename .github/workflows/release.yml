name: Release

# 打 tag（如 v1.0.1）自动构建并发布 Release，APK 作为附件挂在 Release 下。
# 用仓库自带的 GITHUB_TOKEN，不需要额外配置 secret。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 仓库里的 wrapper 指向腾讯云镜像（方便国内 clone），CI 在海外跑，换回官方源
      - name: Point wrapper at official Gradle
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/PersephoneTV-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/PersephoneTV-${GITHUB_REF_NAME}-release.apk"
          ls -lh out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.ref_name }}
          path: out/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
